<svg xmlns="http://www.w3.org/2000/svg" width="360" height="344" viewBox="0 0 360 344" role="img" aria-label="ASCII laptop with a smiling robot face on the screen">
<style>text{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;white-space:pre;}
    .frame { opacity: 0; animation: cyc 5.2s steps(1) infinite; }
    @keyframes cyc { 0%   { opacity: 1; }
                     25.0000% { opacity: 0; }
                     100% { opacity: 0; } }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .led { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    .bob { animation: bob 2.6s ease-in-out infinite; }
    @keyframes bob { 0%, 100% { transform: translateY(0); }
                     50%       { transform: translateY(-3px); } }
    @media (prefers-reduced-motion: reduce) {
      .frame { animation: none; }
      .frame0 { opacity: 1; }
      .cursor, .led, .bob { animation: none; }
    }</style>
<rect width="360" height="344" rx="10" fill="#0d1117" stroke="#21262d"/>
<rect x="70.8" y="74.8" width="218.4" height="103.5" rx="3" fill="#0a1a12"/>
