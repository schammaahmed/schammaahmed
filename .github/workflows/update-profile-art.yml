name: update profile art

on:
  schedule:
    # 06:17 UTC daily - off the hour, since GitHub's scheduler queues heavily
    # at :00 and delays runs by many minutes.
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update-profile-art.yml"

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Fetch contributions
        run: python scripts/fetch_contributions.py
        env:
          GH_USERNAME: ${{ github.repository_owner }}

      - name: Render SVGs
        run: |
          python scripts/render_heatmap_svg.py
          python scripts/make_info_card.py
          python scripts/make_showcase_svg.py
          python scripts/make_robot_svg.py

      - name: Bust the camo cache
        # GitHub proxies README images and caches them hard. Stamping today's
        # date into the query string gives each day's render a fresh URL.
        run: sed -i "s/?v=[0-9]\{8\}/?v=$(date -u +%Y%m%d)/g" README.md

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "chore: refresh profile art [skip ci]"
            git push
          fi
